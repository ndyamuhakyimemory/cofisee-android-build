
name: Build Secure Loan Management System Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "Android SDK platform 35 is missing."
            exit 1
          }

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Build secure Android APK
        working-directory: COFISEE-Android-App-Project
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Loan-Management-System-APK
          path: COFISEE-Android-App-Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
