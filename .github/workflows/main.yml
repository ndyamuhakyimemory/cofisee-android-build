
name: Build COFISEE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'COFISEE-Android-App-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Checking Android SDK..."
          ls -la "$ANDROID_HOME"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager

      - name: Install Android packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Extract COFISEE project
        run: unzip -q COFISEE-Android-App-Project-1.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build COFISEE APK
        run: gradle -p COFISEE-Android-App-Project assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COFISEE-Android-APK
          path: COFISEE-Android-App-Project/app/build/outputs/apk/debug/app-debug.apk
          
