
name: Build COFISEE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'COFISEE-Android-App-Project-1.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - run: unzip -q COFISEE-Android-App-Project-1.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle -p COFISEE-Android-App-Project assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: COFISEE-Android-APK
          path: COFISEE-Android-App-Project/app/build/outputs/apk/debug/app-debug.apk
          
